<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore - Home</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div class="nav">
        <div>
            <a href="index.html">Home</a>
            <a href="#">Cart</a>
        </div>
        <div>
            <a href="login.html">Login</a>
            <a href="#">Register</a>
        </div>
    </div>

    <div class="container">
        <h2>Browse Books (Frontend Demo)</h2>
        <form style="margin-bottom:20px;">
            <input type="text" placeholder="Search by Title or Author..." style="width: auto; display: inline-block;">
            <input type="submit" value="Search">
        </form>

        <table>
            <tr><th>Image</th><th>Title</th><th>Author</th><th>Price</th><th>Action</th></tr>
            <tr>
                <td><img src="https://dummyimage.com/50x70/e8eef5/222.png&text=Book" width="50" height="70" alt="cover"></td>
                <td>Atomic Habits</td><td>James Clear</td><td>$18.99</td>
                <td>
                    <a class="btn btn-warning" href="#">Details</a>
                    <a class="btn" href="#">Add to Cart</a>
                </td>
            </tr>
            <tr>
                <td><img src="https://dummyimage.com/50x70/e8eef5/222.png&text=Book" width="50" height="70" alt="cover"></td>
                <td>The Pragmatic Programmer</td><td>Andrew Hunt</td><td>$24.50</td>
                <td>
                    <a class="btn btn-warning" href="#">Details</a>
                    <button class="btn" style="background:#aaa; cursor:not-allowed;" disabled>In Cart</button>
                </td>
            </tr>
            <tr>
                <td><img src="https://dummyimage.com/50x70/e8eef5/222.png&text=Book" width="50" height="70" alt="cover"></td>
                <td>Clean Code</td><td>Robert C. Martin</td><td>$21.00</td>
                <td>
                    <a class="btn btn-warning" href="#">Details</a>
                    <a class="btn" href="#">Add to Cart</a>
                </td>
            </tr>
        </table>
    </div>

    <div style="text-align: center; padding: 30px; color: #777; font-size: 14px;">
        &copy; 2026 Online Bookstore. Frontend demo on GitHub Pages.
    </div>
</body>
</html>
